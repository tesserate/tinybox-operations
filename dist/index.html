.table tbody tr:last-child :is(th, td) {

}

.table.table-sm :is(th, td) {

}

.table.table-sm :is(th, td):not(:last-child) {

}

.table :is(.text-end, [align=&quot;right&quot;]) {

}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {

}

#widget {

  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);

  background: var(--card);

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);

  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget &gt; :not(.card, .widget, .progress) {

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);

  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;

}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {

  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

hr {

  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {

}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: var(--cursor-interaction, pointer);
  text-decoration: none;
}

.btn:not(:disabled):hover,
.nav-link:not(:disabled):not([aria-disabled=&quot;true&quot;]):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.nav-pills .nav-link {
  min-width: 0;
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.nav-justified .nav-link {
  flex: 1 1 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

.nav-pills .nav-link.active {
  color: var(--foreground);
  background: var(--muted);
}

/* Shared preview chrome; product styles stay inside each variant. */
.viz-dotted-background {
  background-image: radial-gradient(
    circle,
    color-mix(in srgb, var(--foreground) 14%, transparent) 0.8px,
    transparent 0.8px
  );
  background-position: center;
  background-size: 16px 16px;
}

.viz-carousel {
  position: relative;
  min-width: 0;
}

.viz-carousel:has(&gt; .viz-carousel-controls) {
  min-height: calc(60px + var(--viz-carousel-picker-height, 0px));
  padding-bottom: 60px;
}

.viz-carousel &gt; [data-variant][hidden] {
  display: none !important;
}

.viz-carousel &gt; [data-variant] {
  isolation: isolate;
}

.viz-carousel-controls {
  --viz-carousel-hover: light-dark(
    color-mix(in srgb, var(--foreground) 5.4%, transparent),
    color-mix(in srgb, var(--foreground) 7.8%, transparent)
  );
  position: absolute;
  z-index: 2;
  bottom: 8px;
  left: 50%;
  display: flex;
  width: max-content;
  /* Leave room for the host's design-controls launcher at the trailing edge. */
  max-width: calc(100% - 96px);
  align-items: center;
  gap: 0;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--foreground);
  background: var(--background);
  font-family: var(--font-sans);
  /* Match the settings dropdown chrome independently of the content font size. */
  font-size: 13px;
  font-weight: var(--font-weight-normal);
  line-height: 18px;
  transform: translateX(-50%);
  user-select: none;
}

/* Keep authored mockup button styles out of the shared carousel chrome. */
.viz-carousel-controls button,
.viz-carousel-picker &gt; summary {
  display: flex !important;
  height: auto !important;
  min-height: 30px;
  align-items: center !important;
  justify-content: center !important;
  gap: 4px;
  padding: 0 6px !important;
  -webkit-app-region: no-drag;
  border: 0 !important;
  border-radius: 14px !important;
  color: inherit !important;
  background: transparent !important;
  font: inherit !important;
  -webkit-tap-highlight-color: transparent;
}

.viz-carousel-controls &gt; button,
.viz-carousel-picker &gt; summary {
  position: relative;
  isolation: isolate;
}

.viz-carousel-controls &gt; button {
  --icon-size: 16px;
  width: 30px !important;
  padding: 0 !important;
}

.viz-carousel-picker &gt; summary {
  padding-inline: 12px !important;
}

.viz-carousel-controls .viz-carousel-caret {
  width: 14px;
  height: 14px;
  flex: none;
  margin: 0;
  color: inherit;
  transform: rotate(180deg);
}

.viz-carousel-controls &gt; button &gt; svg,
.viz-carousel-controls .viz-carousel-caret,
.viz-carousel-count {
  opacity: 0.5;
}

.viz-carousel-controls &gt; button::before,
.viz-carousel-picker &gt; summary::before {
  position: absolute;
  z-index: -1;
  inset: 3px;
  border-radius: 12px;
  content: &quot;&quot;;
  pointer-events: none;
}

.viz-carousel-controls &gt; button:hover::before,
.viz-carousel-picker &gt; summary:hover::before {
  background: var(--viz-carousel-hover);
}

.viz-carousel-controls &gt; button,
.viz-carousel-controls [data-lucide],
.viz-carousel-controls .lucide {
  flex-shrink: 0;
}

.viz-carousel-picker {
  min-width: 0;
}

.viz-carousel-picker &gt; summary {
  min-width: 0;
  list-style: none;
}

.viz-carousel-picker &gt; summary::-webkit-details-marker {
  display: none;
}

.viz-carousel-count {
  flex-shrink: 0;
  white-space: nowrap;
}

.viz-carousel-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.viz-carousel-options {
  position: absolute;
  right: 0;
  bottom: calc(100% + 4px);
  left: 0;
  display: flex;
  max-height: 240px;
  flex-direction: column;
  gap: 2px;
  overflow: auto;
  padding: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--background);
  box-shadow: 0 4px 12px light-dark(rgb(0 0 0 / 6%), rgb(0 0 0 / 25%));
}

.viz-carousel-options &gt; button {
  border-radius: max(0px, calc(var(--radius-lg) - 5px)) !important;
  width: 100% !important;
  min-height: 28px;
  justify-content: flex-start !important;
  padding: 4px 8px !important;
  font-size: var(--font-size-small) !important;
  text-align: start;
  white-space: normal;
  overflow-wrap: anywhere;
}

.viz-carousel-options &gt; [aria-current=&quot;true&quot;],
.viz-carousel-options &gt; button:hover {
  background: var(--viz-carousel-hover) !important;
}

.btn:disabled,
.nav-link:disabled,
.nav-link[aria-disabled=&quot;true&quot;] {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: var(--corner-shape);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.viz-carousel-controls :is(button, summary):focus-visible {
  outline: 2px solid var(--ring) !important;
  outline-offset: 2px !important;
}

@media (pointer: coarse) {
  .viz-carousel:has(&gt; .viz-carousel-controls) {
    min-height: calc(76px + var(--viz-carousel-picker-height, 0px));
    padding-bottom: 76px;
  }

  .btn,
  .nav-link,
  .viz-carousel-controls button,
  .viz-carousel-picker &gt; summary,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;

function taskTable(list){return `&lt;div class=&quot;table-wrap&quot;&gt;&lt;table class=&quot;task-table&quot;&gt;&lt;colgroup&gt;&lt;col&gt;&lt;col&gt;&lt;col&gt;&lt;col&gt;&lt;col&gt;&lt;col&gt;&lt;/colgroup&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Status&lt;/th&gt;&lt;th&gt;Project / batch&lt;/th&gt;&lt;th&gt;Action / task&lt;/th&gt;&lt;th&gt;Owner&lt;/th&gt;&lt;th&gt;Deadline&lt;/th&gt;&lt;th&gt;Complete&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${list.map(t=&gt;{const [label,cls]=status(t);return `&lt;tr&gt;&lt;td&gt;${tag(label,cls)}${!t.done&amp;&amp;t.status&amp;&amp;t.status!==label?'&lt;small class=&quot;muted&quot;&gt;'+esc(t.status)+'&lt;/small&gt;':''}&lt;/td&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;link cursor-interaction&quot; data-project=&quot;${t.job}&quot;&gt;${t.job}&lt;/button&gt;&lt;small class=&quot;muted&quot;&gt;${esc(jobBy(t.job)?.name||'')}&lt;/small&gt;&lt;/td&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;plain cursor-interaction&quot; data-edit-task=&quot;${t.id}&quot;&gt;${esc(t.title)}&lt;/button&gt;${t.parent?`&lt;small class=&quot;muted&quot;&gt;${esc(taskBy(t.parent)?.title||'')}&lt;/small&gt;`:''}&lt;/td&gt;&lt;td&gt;${esc(t.owner)}&lt;/td&gt;&lt;td&gt;${date(t.end)}&lt;/td&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-complete=&quot;${t.id}&quot;&gt;${t.done?'Reopen':'✓ Done'}&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;`;}).join('')}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;`;}
function todayPage(){const ls=tasks.filter(t=&gt;!t.group&amp;&amp;!t.done).sort((a,b)=&gt;a.end-b.end);const ranges=[['Overdue',ls.filter(t=&gt;t.end&lt;today)],['Today',ls.filter(t=&gt;t.end===today)],['This week',ls.filter(t=&gt;t.end&gt;today&amp;&amp;t.end&lt;=10)]];return ranges.map(([title,ts])=&gt;`&lt;div class=&quot;section-title&quot;&gt;${title}&lt;small&gt;${ts.length} tasks&lt;/small&gt;&lt;/div&gt;${ts.length?taskTable(ts):'&lt;p class=&quot;small muted&quot;&gt;Nothing outstanding.&lt;/p&gt;'}`).join('')+`&lt;button type=&quot;button&quot; class=&quot;group-toggle cursor-interaction&quot; data-action=&quot;toggle-future&quot; aria-expanded=&quot;${state.future}&quot;&gt;&lt;span&gt;${state.future?'▾':'▸'} Future&lt;/span&gt;&lt;span&gt;${ls.filter(t=&gt;t.end&gt;10).length} tasks · from ${date(11)}&lt;/span&gt;&lt;/button&gt;${state.future?taskTable(ls.filter(t=&gt;t.end&gt;10)):''}${state.completed?'&lt;div class=&quot;section-title&quot;&gt;Completed&lt;/div&gt;'+taskTable(tasks.filter(t=&gt;!t.group&amp;&amp;t.done)):''}`;}
function levelControl(){return `&lt;label class=&quot;choice&quot;&gt;Detail&lt;select id=&quot;tb2-level&quot; aria-label=&quot;Timeline detail level&quot;&gt;${[[0,'Projects / batches'],[1,'Stages'],[2,'Tasks'],[3,'Subtasks']].map(([n,l])=&gt;`&lt;option value=&quot;${n}&quot; ${state.level===n?'selected':''}&gt;${l}&lt;/option&gt;`).join('')}&lt;/select&gt;&lt;/label&gt;`;}
function visibleTasks(job){const out=[];function walk(parent){for(const t of tasks.filter(x=&gt;x.job===job&amp;&amp;x.parent===parent)){if(depth(t)&gt;state.level)continue;out.push(t);if(t.group&amp;&amp;!state.collapsed.includes(t.id))walk(t.id);}}walk(null);return out;}
function gantt(jobList){let r=2;let body=`&lt;div class=&quot;row space&quot;&gt;&lt;span class=&quot;small&quot;&gt;${date(state.ganttStart)} – ${date(state.ganttStart+27)}, 2026&lt;/span&gt;&lt;div class=&quot;tabs&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-range=&quot;-28&quot; aria-label=&quot;Previous 28 days&quot;&gt;← Earlier&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-range=&quot;28&quot; aria-label=&quot;Next 28 days&quot;&gt;Later →&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;gantt-wrap&quot;&gt;&lt;div class=&quot;gantt&quot;&gt;&lt;div class=&quot;g-label&quot; style=&quot;grid-row:1&quot;&gt;Work / task&lt;/div&gt;${Array.from({length:28},(_,n)=&gt;`&lt;div class=&quot;g-day ${n+state.ganttStart===today?'today':''}&quot; style=&quot;grid-row:1;grid-column:${n+2}&quot;&gt;${new Date(origin+(n+state.ganttStart)*DAY).getUTCDate()}&lt;/div&gt;`).join('')}`;for(const type of ['production','order']){const list=jobList.filter(j=&gt;j.type===type);if(!list.length)continue;body+=`&lt;div class=&quot;g-group&quot; style=&quot;grid-row:${r++}&quot;&gt;${type==='production'?'Factory production':'Customer delivery / installation'}&lt;/div&gt;`;for(const j of list){const tl=leaves(j.id),start=tl.length?Math.min(...tl.map(t=&gt;t.start)):j.start,end=tl.length?Math.max(...tl.map(t=&gt;t.end)):j.promise;body+=ganttRow({id:j.id,title:j.name,job:j.id,start,end,jobrow:true},r++);for(const t of visibleTasks(j.id))body+=ganttRow(t,r++);}}return body+`&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;row space&quot;&gt;&lt;span class=&quot;small muted&quot;&gt;Daily scale · click a bar to edit · drag to move · right edge to resize&lt;/span&gt;&lt;span class=&quot;small muted&quot;&gt;Factory receipt → material availability → customer work&lt;/span&gt;&lt;/div&gt;`;}
function ganttRow(t,r){const [a,b]=t.jobrow?[t.start,t.end]:dates(t),start=Math.max(state.ganttStart,a)-state.ganttStart,end=Math.min(state.ganttStart+27,b)-state.ganttStart,off=end&lt;0||start&gt;27,st=t.jobrow?['','']:status(t),dep=t.depends?taskBy(t.depends):null,conflict=dep&amp;&amp;dates(dep)[1]&gt;=a&amp;&amp;!dep.done;const label=t.jobrow?`&lt;button type=&quot;button&quot; class=&quot;link cursor-interaction&quot; data-project=&quot;${t.id}&quot;&gt;&lt;strong&gt;${t.id}&lt;/strong&gt; · ${esc(t.title)}&lt;/button&gt;`:`${t.group?`&lt;button type=&quot;button&quot; class=&quot;expand cursor-interaction&quot; data-collapse=&quot;${t.id}&quot; aria-label=&quot;${state.collapsed.includes(t.id)?'Expand':'Collapse'} ${esc(t.title)}&quot;&gt;${state.collapsed.includes(t.id)?'▸':'▾'}&lt;/button&gt;`:`&lt;span class=&quot;g-status ${st[1]}&quot;&gt;&lt;/span&gt;`}&lt;button type=&quot;button&quot; class=&quot;plain cursor-interaction&quot; data-edit-task=&quot;${t.id}&quot;&gt;${esc(t.title)}&lt;/button&gt;`;return `&lt;div class=&quot;g-label&quot; style=&quot;grid-row:${r};padding-left:${t.jobrow?0:(depth(t)-1)*12+8}px&quot;&gt;${label}&lt;/div&gt;&lt;div class=&quot;g-track&quot; style=&quot;grid-row:${r}&quot;&gt;&lt;/div&gt;${off?'':`&lt;button type=&quot;button&quot; class=&quot;g-bar cursor-interaction ${t.jobrow?'jobbar':t.group?'parent':conflict?'red':st[1]}&quot; style=&quot;grid-row:${r};grid-column:${start+2}/${end+3}&quot; ${t.jobrow?`data-project=&quot;${t.id}&quot;`:`data-edit-task=&quot;${t.id}&quot; ${t.group?'':`data-drag-task=&quot;${t.id}&quot;`}`} aria-label=&quot;${esc(t.title)}: ${date(a)} to ${date(b)}${conflict?', dependency conflict':''}&quot;&gt;${t.group?'':end-start&gt;=3?esc(t.title):end-start&gt;=1?date(a):''}${!t.group&amp;&amp;!t.jobrow?'&lt;span class=&quot;g-handle&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;':''}&lt;/button&gt;`}`;}
function projectPage(){const j=jobBy(state.project)||jobs[1];const ls=leaves(j.id),done=ls.filter(t=&gt;t.done).length;return `&lt;div class=&quot;viewbar&quot;&gt;&lt;label class=&quot;choice&quot;&gt;Work record&lt;select id=&quot;tb2-project-select&quot;&gt;${jobs.filter(x=&gt;x.status!=='Draft quote').map(x=&gt;`&lt;option value=&quot;${x.id}&quot; ${x.id===j.id?'selected':''}&gt;${x.id} · ${esc(x.name)}&lt;/option&gt;`).join('')}&lt;/select&gt;&lt;/label&gt;&lt;div class=&quot;tabs&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-project-view=&quot;timeline&quot; aria-pressed=&quot;${state.projectView==='timeline'}&quot;&gt;Timeline&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-project-view=&quot;list&quot; aria-pressed=&quot;${state.projectView==='list'}&quot;&gt;Task list&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-action=&quot;daily-update&quot;&gt;Daily update&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;project-meta&quot;&gt;&lt;span&gt;Customer / factory&lt;strong&gt;${esc(j.party)}&lt;/strong&gt;&lt;/span&gt;&lt;span&gt;Site&lt;strong&gt;${esc(j.site)}&lt;/strong&gt;&lt;/span&gt;&lt;span&gt;${j.type==='production'?'Stock usable':'Promised delivery'}&lt;strong&gt;${date(j.promise)}&lt;/strong&gt;&lt;/span&gt;&lt;span&gt;Steps&lt;strong&gt;${done} / ${ls.length} complete&lt;/strong&gt;&lt;/span&gt;&lt;/div&gt;${j.type==='order'?`&lt;div class=&quot;row space&quot;&gt;&lt;span class=&quot;small&quot;&gt;${j.model} · ${j.frame} · allocated materials linked to this order&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;link cursor-interaction&quot; data-open-order=&quot;${j.id}&quot;&gt;Open order configuration →&lt;/button&gt;&lt;/div&gt;`:''}${state.projectView==='timeline'?`&lt;div class=&quot;row space&quot;&gt;&lt;span class=&quot;small muted&quot;&gt;Expand stages to see tasks and subtasks.&lt;/span&gt;${levelControl()}&lt;/div&gt;${gantt([j])}`:taskTable(ls.sort((a,b)=&gt;a.end-b.end))}`;}
function orderPage(){if(state.quoteOpen)return quoteForm();return `&lt;div class=&quot;title&quot;&gt;&lt;div&gt;&lt;h2&gt;Quotes &amp; orders&lt;/h2&gt;&lt;p&gt;One record from draft quote to confirmed order.&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;primary cursor-interaction&quot; data-action=&quot;new-quote&quot;&gt;New quote&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;table-wrap&quot;&gt;&lt;table class=&quot;order-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Status&lt;/th&gt;&lt;th&gt;Quote / order&lt;/th&gt;&lt;th&gt;Customer&lt;/th&gt;&lt;th&gt;Model / frame&lt;/th&gt;&lt;th&gt;Delivery&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;Price&lt;/th&gt;&lt;th&gt;Open&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${jobs.filter(j=&gt;j.type==='order').map(j=&gt;`&lt;tr&gt;&lt;td&gt;${tag(j.status,j.status==='Confirmed'?'green':'')}&lt;/td&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;link cursor-interaction&quot; data-open-order=&quot;${j.id}&quot;&gt;${j.id} · ${esc(j.name)}&lt;/button&gt;&lt;/td&gt;&lt;td&gt;${esc(j.party)}&lt;/td&gt;&lt;td&gt;${j.id==='Q-104'?quote.model:j.model} · ${j.id==='Q-104'?quote.frame:j.frame}&lt;/td&gt;&lt;td&gt;${date(j.id==='Q-104'?quote.date:j.promise)}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${money(j.id==='Q-104'?qcalc().price:j.id==='O-101'?49000:39500)}&lt;/td&gt;&lt;td&gt;${j.status==='Confirmed'?`&lt;button type=&quot;button&quot; class=&quot;link cursor-interaction&quot; data-project=&quot;${j.id}&quot;&gt;Project →&lt;/button&gt;`:'Draft'}&lt;/td&gt;&lt;/tr&gt;`).join('')}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;`;}
function select(id,value,choices,disabled=false){return `&lt;select id=&quot;${id}&quot; ${disabled?'disabled':''}&gt;${choices.map(v=&gt;`&lt;option ${v===value?'selected':''}&gt;${esc(v)}&lt;/option&gt;`).join('')}&lt;/select&gt;`;}
function quoteForm(){const j=jobBy(state.quoteId),draft=j.id==='Q-104'&amp;&amp;j.status==='Draft quote',q=qcalc();if(j.id!=='Q-104')return `&lt;div class=&quot;title&quot;&gt;&lt;div&gt;&lt;button type=&quot;button&quot; class=&quot;link cursor-interaction&quot; data-action=&quot;orders-back&quot;&gt;← All quotes &amp; orders&lt;/button&gt;&lt;h2 class=&quot;space&quot;&gt;${j.id} · ${esc(j.name)}&lt;/h2&gt;&lt;/div&gt;${tag('Confirmed','green')}&lt;/div&gt;&lt;div class=&quot;header-fields&quot;&gt;&lt;label&gt;Name&lt;input value=&quot;${esc(j.party)}&quot; readonly&gt;&lt;/label&gt;&lt;label&gt;Delivery date&lt;input type=&quot;date&quot; value=&quot;${iso(j.promise)}&quot; readonly&gt;&lt;/label&gt;&lt;label&gt;Delivery site&lt;input value=&quot;${esc(j.site)}&quot; readonly&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Option&lt;/th&gt;&lt;th&gt;Approved selection&lt;/th&gt;&lt;th&gt;Availability&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Model&lt;/td&gt;&lt;td&gt;${j.model}&lt;/td&gt;&lt;td&gt;${tag('Allocated','green')}&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Frame&lt;/td&gt;&lt;td&gt;${j.frame}&lt;/td&gt;&lt;td&gt;${tag('Allocated','green')}&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Siding&lt;/td&gt;&lt;td&gt;Cedar / steel · saved configuration&lt;/td&gt;&lt;td&gt;${tag('Reserved','green')}&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div class=&quot;row space&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;primary cursor-interaction&quot; data-project=&quot;${j.id}&quot;&gt;Open project tasks&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-action=&quot;revision&quot;&gt;Create revision&lt;/button&gt;&lt;/div&gt;`;
return `&lt;div class=&quot;title&quot;&gt;&lt;div&gt;&lt;button type=&quot;button&quot; class=&quot;link cursor-interaction&quot; data-action=&quot;orders-back&quot;&gt;← All quotes &amp; orders&lt;/button&gt;&lt;h2 class=&quot;space&quot;&gt;${j.id} · ${j.status==='Confirmed'?'Confirmed order':'New studio quote'}&lt;/h2&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;primary cursor-interaction&quot; data-action=&quot;confirm-quote&quot; ${draft?'':'disabled'}&gt;${draft?'Confirm order':'Confirmed'}&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;header-fields&quot;&gt;&lt;label&gt;Name&lt;input id=&quot;tb2-q-name&quot; value=&quot;${esc(quote.customer)}&quot; ${draft?'':'readonly'}&gt;&lt;/label&gt;&lt;label&gt;Requested delivery&lt;input id=&quot;tb2-q-date&quot; type=&quot;date&quot; value=&quot;${iso(quote.date)}&quot; ${draft?'':'readonly'}&gt;&lt;/label&gt;&lt;label&gt;Delivery site&lt;input id=&quot;tb2-q-site&quot; value=&quot;${esc(quote.site)}&quot; ${draft?'':'readonly'}&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;split&quot;&gt;&lt;div&gt;&lt;div class=&quot;table-wrap&quot;&gt;&lt;table class=&quot;option-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Option&lt;/th&gt;&lt;th&gt;Selection / coverage&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;Price&lt;/th&gt;&lt;th&gt;Availability&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;

&lt;tr&gt;&lt;td&gt;Siding&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;choice&quot;&gt;${select('tb2-q-siding',quote.siding==='cedar'?'Cedar':'Steel',['Cedar','Steel'],!draft)}${select('tb2-q-coverage',quote.coverage+' sides',['Half sides','Full sides'],!draft)}&lt;/div&gt;&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${money(q.mainPrice)}&lt;/td&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;link cursor-interaction&quot; data-action=&quot;availability&quot;&gt;${q.available&gt;=q.qty?tag('By '+date(q.need),'green'):tag('Shortfall','red')}&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;
${quote.coverage==='Half'?`&lt;tr&gt;&lt;td&gt;Other sides&lt;/td&gt;&lt;td&gt;Steel · remaining half&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;Included&lt;/td&gt;&lt;td&gt;${tag(q.steelAvailable&gt;=q.steel?'In stock':'Shortfall',q.steelAvailable&gt;=q.steel?'green':'red')}&lt;/td&gt;&lt;/tr&gt;`:''}

function productionPage(){const j=jobs[0];return `&lt;div class=&quot;title&quot;&gt;&lt;div&gt;&lt;h2&gt;Production&lt;/h2&gt;&lt;p&gt;Factory batches use the same tasks and timeline.&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;primary cursor-interaction&quot; data-action=&quot;new-batch&quot;&gt;New production batch&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;viewbar&quot;&gt;&lt;div class=&quot;tabs&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-production-view=&quot;timeline&quot; aria-pressed=&quot;${state.productionView==='timeline'}&quot;&gt;Timeline&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-production-view=&quot;table&quot; aria-pressed=&quot;${state.productionView==='table'}&quot;&gt;Batch table&lt;/button&gt;&lt;/div&gt;${levelControl()}&lt;/div&gt;&lt;div class=&quot;project-meta&quot;&gt;&lt;span&gt;F-12&lt;strong&gt;Cedar siding · 120 panels&lt;/strong&gt;&lt;/span&gt;&lt;span&gt;Usable receipt&lt;strong&gt;${date(taskBy('F-REC').end)}&lt;/strong&gt;&lt;/span&gt;&lt;span&gt;Destination&lt;strong&gt;Toronto warehouse&lt;/strong&gt;&lt;/span&gt;&lt;/div&gt;${state.productionView==='timeline'?gantt(jobs.filter(j=&gt;j.type==='production')):`&lt;div class=&quot;table-wrap space&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Batch&lt;/th&gt;&lt;th&gt;Output&lt;/th&gt;&lt;th&gt;Quantity&lt;/th&gt;&lt;th&gt;Status&lt;/th&gt;&lt;th&gt;Usable date&lt;/th&gt;&lt;th&gt;Tasks&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${jobs.filter(j=&gt;j.type==='production').map(j=&gt;`&lt;tr&gt;&lt;td&gt;${j.id}&lt;/td&gt;&lt;td&gt;${esc(j.name)}&lt;/td&gt;&lt;td&gt;${j.qty||120}&lt;/td&gt;&lt;td&gt;${tag(j.status)}&lt;/td&gt;&lt;td&gt;${date(j.id==='F-12'?taskBy('F-REC').end:j.promise)}&lt;/td&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;link cursor-interaction&quot; data-project=&quot;${j.id}&quot;&gt;Open tasks →&lt;/button&gt;&lt;/td&g function inventoryPage(){return `&lt;div class=&quot;title&quot;&gt;&lt;div&gt;&lt;h2&gt;Inventory&lt;/h2&gt;&lt;p&gt;Actual stock + dated supply − confirmed commitments.&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;primary cursor-interaction&quot; data-complete=&quot;F-REC&quot;&gt;Receive stock&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;viewbar&quot;&gt;&lt;span class=&quot;small&quot;&gt;Toronto warehouse · exact item variants&lt;/span&gt;&lt;label class=&quot;choice&quot;&gt;Available by&lt;input type=&quot;date&quot; id=&quot;tb2-stock-date&quot; value=&quot;${iso(state.stockDate)}&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Item&lt;/th&gt;&lt;th&gt;Unit&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;Usable now&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;Incoming by date&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;Committed&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;Available by date&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${items.map(i=&gt;{const s=stock(i.id),now=stock(i.id,today);return `&lt;tr&gt;&lt;td&gt;${esc(i.name)}&lt;/td&gt;&lt;td&gt;${i.unit}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${now.actual}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${s.incoming}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${s.reserved}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${s.free}&lt;/td&gt;&lt;/tr&gt;`;}).join('')}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;h3 class=&quot;space&quot;&gt;Linked stock entries&lt;/h3&gt;&lt;div class=&quot;table-wrap space&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Type&lt;/th&gt;&lt;th&gt;Work record&lt;/th&gt;&lt;th&gt;Item&lt;/th&gt;&lt;th&gt;Quantity&lt;/th&gt;&lt;th&gt;Date&lt;/th&gt;&lt;th&gt;Source&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${entries.filter(e=&gt;e.item==='cedar').sort((a,b)=&gt;a.at-b.at).map(e=&gt;`&lt;tr&gt;&lt;td&gt;${tag(e.kind==='incoming'?'Expected receipt':e.kind==='reserved'?'Reservation':'Actual movement',e.kind==='actual'?'green':'')}&lt;/td&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;link cursor-interaction&quot; data-project=&quot;${e.job}&quot;&gt;${e.job}&lt;/button&gt;&lt;/td&gt;&lt;td&gt;Cedar siding&lt;/td&gt;&lt;td&gt;${e.qty}&lt;/td&gt;&lt;td&gt;${date(e.at)}&lt;/td&gt;&lt;td&gt;${e.task?`&lt;button type=&quot;button&quot; class=&quot;link cursor-interaction&quot; data-edit-task=&quot;${e.task}&quot;&gt;${esc(e.label)}&lt;/button&gt;`:esc(e.label)}&lt;/td&gt;&lt;/tr&gt;`).join('')}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;small muted space&quot;&gt;Existing commitments remain protected. Receipts reduce the expected balance; issues clear the corresponding reservation.&lt;/p&gt;`;}
function presetPage(){const p=presets[state.presetVariant];return `&lt;div class=&quot;title&quot;&gt;&lt;div&gt;&lt;h2&gt;Presets&lt;/h2&gt;&lt;p&gt;Option → materials + tasks + timing + cost. Used when work is created.&lt;/p&gt;&lt;/div&gt;&lt;label&gt;Model / frame&lt;select id=&quot;tb2-preset-variant&quot;&gt;${Object.keys(presets).map(k=&gt;`&lt;option value=&quot;${k}&quot; ${k===state.presetVariant?'selected':''}&gt;${k.replace('|',' · ')}&lt;/option&gt;`).join('')}&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;table-wrap&quot;&gt;&lt;table class=&quot;preset-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Option / coverage&lt;/th&gt;&lt;th&gt;Materials&lt;/th&gt;&lt;th&gt;Tasks created&lt;/th&gt;&lt;th&gt;Timing&lt;/th&gt;&lt;th&gt;Labour&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;Cost&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;Price&lt;/th&gt;&lt;th&gt;Edit&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Base · ${p.model} / ${p.frame}&lt;/td&gt;&lt;td&gt;Frame + panel kit × 1&lt;/td&gt;&lt;td&gt;Prepare, deliver, assemble&lt;/td&gt;&lt;td&gt;From delivery date&lt;/td&gt;&lt;td&gt;40 h&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;Demo&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${money(p.base)}&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;${[.5,1].map(f=&gt;`&lt;tr&gt;&lt;td&gt;Cedar · ${f===.5?'half':'full'} sides&lt;/td&gt;&lt;td&gt;${p.panels*f} cedar panels&lt;/td&gt;&lt;td&gt;Pick siding → install → inspect&lt;/td&gt;&lt;td&gt;Pick ${p.leadDays}d before build&lt;br&gt;Install ${p.days}d&lt;/td&gt;&lt;td&gt;${(p.panels*f*p.hoursPerPanel).toFixed(1)} h&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${money(p.panels*f*p.cedarCost)}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${money(p.panels*f*p.cedarPrice)}&lt;/td&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;link cursor-interaction&quot; data-action=&quot;edit-preset&quot;&gt;Edit&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;`).join('')}&lt;tr&gt;&lt;td&gt;Electrical · hookup&lt;/td&gt;&lt;td&gt;Electrical package × 1&lt;/td&gt;&lt;td&gt;Book electrician → install → check&lt;/td&gt;&lt;td&gt;Book 10d before build&lt;/td&gt;&lt;td&gt;6 h&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;$1,500&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;$2,500&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Production · cedar&lt;/td&gt;&lt;td&gt;Output: chosen batch quantity&lt;/td&gt;&lt;td&gt;Produce → ship → receive&lt;/td&gt;&lt;td&gt;Default offsets from start&lt;/td&gt;&lt;td&gt;Factory estimate&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;Per batch&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;—&lt;/td&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;link cursor-interaction&quot; data-action=&quot;new-batch&quot;&gt;Open form&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div class=&quot;notice space&quot;&gt;Half/full coverage is entered on the quote. Exact component quantities come from this table. Custom overrides remain optional.&lt;/div&gt;&lt;p class=&quot;small muted space&quot;&gt;All four model/frame combinations are shown for review. Recipes and compatibility need validation. Existing confirmed work retains its preset version.&lt;/p&gt;`;}
function renderSchema(){const data=[['work','Work','Customer quotes/orders and factory batches','ID, type, customer/factory, status, site, requested/promised dates','Groups selections, tasks and stock entries'],['selections','Selections','Options chosen for each order; batch outputs','Work ID, option, model/frame preset, coverage, override, saved price','Uses Presets; produces material demand or supply'],['presets','Presets','What each option needs and creates','Model/frame, option, coverage, item quantities, task templates, offsets, hours, cost, price','Feeds selections and task generation'],['tasks','Tasks','Every action, stage and subtask','Work ID, parent task, action, owner, start/end, dependency, status, completion note','Today / Timeline / Project are views of this table'],['items','Items','Exact inventory variants','SKU, name, colour/size, unit, location','Referenced by preset recipes and stock entries'],['stock','Stock entries','Expected, committed and actual quantities','Item, work, task, type, quantity, date, source/replaces ID','Calculates current stock and future availability']];root.querySelector('#tb2-tables').innerHTML=`&lt;div class=&quot;title&quot;&gt;&lt;div&gt;&lt;h2&gt;Six core tables&lt;/h2&gt;&lt;p&gt;Work is an order or a production batch. A project is its detailed task view.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;schema-flow&quot;&gt;&lt;span&gt;Presets → selections + tasks&lt;/span&gt;&lt;span&gt;Confirmed orders → reserved stock&lt;/span&gt;&lt;span&gt;Production → expected supply → received stock&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;table-wrap&quot;&gt;&lt;table class=&quot;schema-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Table&lt;/th&gt;&lt;th&gt;Contains&lt;/th&gt;&lt;th&gt;Key fields&lt;/th&gt;&lt;th&gt;Connection&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${data.map(([id,name,desc,fields,link])=&gt;`&lt;tr&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;link cursor-interaction&quot; data-table=&quot;${id}&quot;&gt;${name}&lt;/button&gt;&lt;/td&gt;&lt;td&gt;${desc}&lt;/td&gt;&lt;td&gt;${fields}&lt;/td&gt;&lt;td&gt;${link}&lt;/td&gt;&lt;/tr&gt;`).join('')}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div class=&quot;schema-nav&quot;&gt;${data.map(([id,name])=&gt;`&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-table=&quot;${id}&quot; aria-pressed=&quot;${state.table===id}&quot;&gt;${name} rows&lt;/button&gt;`).join('')}&lt;/div&gt;&lt;div id=&quot;tb2-schema-sample&quot;&gt;${schemaSample()}&lt;/div&gt;&lt;p class=&quot;small muted space&quot;&gt;Logical tables shown for review. User access, attachments and audit history support these records; they do not create separate workflows.&lt;/p&gt;`;}
function schemaSample(){let heads,rows;if(state.table==='tasks'){heads=['Task ID','Work ID','Parent task','Action','Start','End'];rows=tasks.slice(8,15).map(t=&gt;[t.id,t.job,t.parent||'—',t.title,date(t.start),date(t.end)]);}else if(state.table==='work'){heads=['Work ID','Type','Name','Status','Target date'];rows=jobs.map(j=&gt;[j.id,j.type,j.name,j.status,date(j.promise)]);}else if(state.table==='selections'){const q=qcalc();heads=['Work ID','Option','Choice','Coverage','Generated requirement'];rows=[['Q-104','Model',quote.model,'—','Frame/panel kit × 1'],['Q-104','Frame',quote.frame,'—',quote.model+' / '+quote.frame],['Q-104','Siding',quote.siding,quote.coverage+' sides',q.qty+' panels'],['F-12','Batch output','Cedar panels','120 units','+120 expected stock']];}else if(state.table==='presets'){heads=['Model / frame','Siding coverage','Materials','Labour','Tasks'];rows=Object.values(presets).map(p=&gt;[p.model+' / '+p.frame,'Half sides',p.panels/2+' cedar panels',(p.panels/2*p.hoursPerPanel).toFixed(1)+' h','Pick → install → inspect']);}else if(state.table==='items'){heads=['SKU','Item','Unit','Location'];rows=items.map(i=&gt;[i.id,i.name,i.unit,'Toronto warehouse']);}else{heads=['Entry','Item','Work','Type','Qty','Date'];rows=entries.filter(e=&gt;e.item==='cedar').map(e=&gt;[e.id,e.item,e.job,e.kind,e.qty,date(e.at)]);}return `&lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;${heads.map(h=&gt;`&lt;th&gt;${h}&lt;/th&gt;`).join('')}&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${rows.map(r=&gt;`&lt;tr&gt;${r.map(v=&gt;`&lt;td&gt;${esc(v)}&lt;/td&gt;`).join('')}&lt;/tr&gt;`).join('')}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;`;}
function openDialog(kind,id,extra={}){lastFocus=document.activeElement;state.dialog={kind,id,...extra};let title='',sub='',body='',confirm='Save';const t=taskBy(id),j=t?jobBy(t.job):null;
if(kind==='complete'){title=t.done?'Reopen task?':t.receipt?'Receive usable stock':'Complete task?';sub=t.job+' · '+t.title;confirm=t.done?'Reopen':t.receipt?'Record receipt':'Confirm complete';const incoming=entries.find(e=&gt;e.task===t.id&amp;&amp;e.kind==='incoming');body=`${t.receipt&amp;&amp;!t.done?`&lt;div class=&quot;fields&quot;&gt;&lt;label&gt;Usable quantity received&lt;input id=&quot;tb2-receive-qty&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;${incoming?.qty||0}&quot; value=&quot;${incoming?.qty||0}&quot;&gt;&lt;/label&gt;&lt;label&gt;Receipt date&lt;input id=&quot;tb2-receive-date&quot; type=&quot;date&quot; value=&quot;${iso(today)}&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;p class=&quot;small muted space&quot;&gt;Outstanding: ${incoming?.qty||0} cedar panels. Partial receipt leaves the remainder expected.&lt;/p&gt;`:''}&lt;label class=&quot;space&quot;&gt;Comment (optional)&lt;textarea id=&quot;tb2-comment&quot; placeholder=&quot;Add a note about what was completed…&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;p class=&quot;small muted space&quot;&gt;Completed by Demo user · recorded in task history.&lt;/p&gt;`;}

        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
