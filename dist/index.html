.table :is(caption, thead th) {

}

.table thead th {

.table tbody tr:last-child :is(th, td) {

.table.table-sm :is(th, td) {

}

.table.table-sm :is(th, td):not(:last-child) {

}

.table :is(.text-end, [align=&quot;right&quot;]) {

}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {

#widget {

  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget &gt; :not(.card, .widget, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;

}

.tooltip {

  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {

}

.viz-stat {
  display: flex;

  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);

}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

hr {
  width: 100%;
  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {
  border-radius: var(--radius-full);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: var(--cursor-interaction, pointer);
  text-decoration: none;
}

.btn:not(:disabled):hover,
.nav-link:not(:disabled):not([aria-disabled=&quot;true&quot;]):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.nav-pills .nav-link {
  min-width: 0;
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.nav-justified .nav-link {
  flex: 1 1 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

.nav-pills .nav-link.active {
  color: var(--foreground);
  background: var(--muted);
}

/* Shared preview chrome; product styles stay inside each variant. */
.viz-dotted-background {
  background-image: radial-gradient(
    circle,
    color-mix(in srgb, var(--foreground) 14%, transparent) 0.8px,
    transparent 0.8px
  );
  background-position: center;
  background-size: 16px 16px;
}

.viz-carousel {
  position: relative;
  min-width: 0;
}

.viz-carousel:has(&gt; .viz-carousel-controls) {
  min-height: calc(60px + var(--viz-carousel-picker-height, 0px));
  padding-bottom: 60px;
}

.viz-carousel &gt; [data-variant][hidden] {
  display: none !important;
}

.viz-carousel &gt; [data-variant] {
  isolation: isolate;
}

.viz-carousel-controls {
  --viz-carousel-hover: light-dark(
    color-mix(in srgb, var(--foreground) 5.4%, transparent),
    color-mix(in srgb, var(--foreground) 7.8%, transparent)
  );
  position: absolute;
  z-index: 2;
  bottom: 8px;
  left: 50%;
  display: flex;
  width: max-content;
  /* Leave room for the host&#x27;s design-controls launcher at the trailing edge. */
  max-width: calc(100% - 96px);
  align-items: center;
  gap: 0;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--foreground);
  background: var(--background);
  font-family: var(--font-sans);
  /* Match the settings dropdown chrome independently of the content font size. */
  font-size: 13px;
  font-weight: var(--font-weight-normal);
  line-height: 18px;
  transform: translateX(-50%);
  user-select: none;
}

/* Keep authored mockup button styles out of the shared carousel chrome. */
.viz-carousel-controls button,
.viz-carousel-picker &gt; summary {
  display: flex !important;
  height: auto !important;
  min-height: 30px;
  align-items: center !important;
  justify-content: center !important;
  gap: 4px;
  padding: 0 6px !important;
  -webkit-app-region: no-drag;
  border: 0 !important;
  border-radius: 14px !important;
  color: inherit !important;
  background: transparent !important;
  font: inherit !important;
  -webkit-tap-highlight-color: transparent;
}

.viz-carousel-controls &gt; button,
.viz-carousel-picker &gt; summary {
  position: relative;
  isolation: isolate;
}

.viz-carousel-controls &gt; button {
  --icon-size: 16px;
  width: 30px !important;
  padding: 0 !important;
}

.viz-carousel-picker &gt; summary {
  padding-inline: 12px !important;
}

.viz-carousel-controls .viz-carousel-caret {
  width: 14px;
  height: 14px;
  flex: none;
  margin: 0;
  color: inherit;
  transform: rotate(180deg);
}

.viz-carousel-controls &gt; button &gt; svg,
.viz-carousel-controls .viz-carousel-caret,
.viz-carousel-count {
  opacity: 0.5;
}

.viz-carousel-controls &gt; button::before,
.viz-carousel-picker &gt; summary::before {
  position: absolute;
  z-index: -1;
  inset: 3px;
  border-radius: 12px;
  content: &quot;&quot;;
  pointer-events: none;
}

.viz-carousel-controls &gt; button:hover::before,
.viz-carousel-picker &gt; summary:hover::before {
  background: var(--viz-carousel-hover);
}

.viz-carousel-controls &gt; button,
.viz-carousel-controls [data-lucide],
.viz-carousel-controls .lucide {
  flex-shrink: 0;
}

.viz-carousel-picker {
  min-width: 0;
}

.viz-carousel-picker &gt; summary {
  min-width: 0;
  list-style: none;
}

.viz-carousel-picker &gt; summary::-webkit-details-marker {
  display: none;
}

.viz-carousel-count {
  flex-shrink: 0;
  white-space: nowrap;
}

.viz-carousel-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.viz-carousel-options {
  position: absolute;
  right: 0;
  bottom: calc(100% + 4px);
  left: 0;
  display: flex;
  max-height: 240px;
  flex-direction: column;
  gap: 2px;
  overflow: auto;
  padding: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--background);
  box-shadow: 0 4px 12px light-dark(rgb(0 0 0 / 6%), rgb(0 0 0 / 25%));
}

.viz-carousel-options &gt; button {
  border-radius: max(0px, calc(var(--radius-lg) - 5px)) !important;
  width: 100% !important;
  min-height: 28px;
  justify-content: flex-start !important;
  padding: 4px 8px !important;
  font-size: var(--font-size-small) !important;
  text-align: start;
  white-space: normal;
  overflow-wrap: anywhere;
}

.viz-carousel-options &gt; [aria-current=&quot;true&quot;],
.viz-carousel-options &gt; button:hover {
  background: var(--viz-carousel-hover) !important;
}

.btn:disabled,
.nav-link:disabled,
.nav-link[aria-disabled=&quot;true&quot;] {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: var(--corner-shape);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.viz-carousel-controls :is(button, summary):focus-visible {
  outline: 2px solid var(--ring) !important;
  outline-offset: 2px !important;
}

@media (pointer: coarse) {
  .viz-carousel:has(&gt; .viz-carousel-controls) {
    min-height: calc(76px + var(--viz-carousel-picker-height, 0px));
    padding-bottom: 76px;
  }

  .btn,
  .nav-link,
  .viz-carousel-controls button,
  .viz-carousel-picker &gt; summary,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;

&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Other configurator options · doors, finishes, layouts&lt;/summary&gt;&lt;div class=&quot;fields space&quot;&gt;&lt;label&gt;Frame colour&lt;select&gt;&lt;option&gt;Black&lt;/option&gt;&lt;option&gt;White&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;Glazing&lt;select&gt;&lt;option&gt;Dual pane&lt;/option&gt;&lt;option&gt;Triple pane&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;Interior finish&lt;select&gt;&lt;option&gt;White&lt;/option&gt;&lt;option&gt;Pine&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;Interior layout&lt;select&gt;&lt;option&gt;Furnish yourself&lt;/option&gt;&lt;option&gt;Built-in furniture&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;p class=&quot;small muted space&quot;&gt;Additional catalog rows shown for layout only in this mockup.&lt;/p&gt;&lt;/details&gt;&lt;details ${quote.override?&#x27;open&#x27;:&#x27;&#x27;}&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Calculated quantities / custom override&lt;/summary&gt;&lt;p class=&quot;small muted space&quot;&gt;${quote.model} + ${quote.frame} preset · ${q.p.panels} panels for full siding&lt;/p&gt;&lt;div class=&quot;row space&quot;&gt;&lt;span class=&quot;small&quot;&gt;Selected siding: ${q.qty} panels · ${q.hours.toFixed(1)} person-hours&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;link cursor-interaction&quot; data-action=&quot;goto-preset&quot;&gt;Edit preset →&lt;/button&gt;&lt;/div&gt;&lt;label class=&quot;check space&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;tb2-q-override&quot; ${quote.override?&#x27;checked&#x27;:&#x27;&#x27;} ${draft?&#x27;&#x27;:&#x27;disabled&#x27;}&gt;Custom quantity override&lt;/label&gt;${quote.override?`&lt;label class=&quot;space&quot;&gt;Custom panel quantity&lt;input type=&quot;number&quot; id=&quot;tb2-q-override-qty&quot; min=&quot;1&quot; value=&quot;${quote.overrideQty}&quot;& function inventoryPage(){return `&lt;div class=&quot;title&quot;&gt;&lt;div&gt;&lt;h2&gt;Inventory&lt;/h2&gt;&lt;p&gt;Actual stock + dated supply − confirmed commitments.&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;primary cursor-interaction&quot; data-complete=&quot;F-REC&quot;&gt;Receive stock&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;viewbar&quot;&gt;&lt;span class=&quot;small&quot;&gt;Toronto warehouse · exact item variants&lt;/span&gt;&lt;label class=&quot;choice&quot;&gt;Available by&lt;input type=&quot;date&quot; id=&quot;tb2-stock-date&quot; value=&quot;${iso(state.stockDate)}&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Item&lt;/th&gt;&lt;th&gt;Unit&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;Usable now&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;Incoming by date&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;Committed&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;Available by date&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${items.map(i=&gt;{const s=stock(i.id),now=stock(i.id,today);return `&lt;tr&gt;&lt;td&gt;${esc(i.name)}&lt;/td&gt;&lt;td&gt;${i.unit}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${now.actual}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${s.incoming}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${s.reserved}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${s.free}&lt;/td&gt;&lt;/tr&gt;`;}).join(&#x27;&#x27;)}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;h3 class=&quot;space&quot;&gt;Linked stock entries&lt;/h3&gt;&lt;div class=&quot;table-wrap space&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Type&lt;/th&gt;&lt;th&gt;Work record&lt;/th&gt;&lt;th&gt;Item&lt;/th&gt;&lt;th&gt;Quantity&lt;/th&gt;&lt;th&gt;Date&lt;/th&gt;&lt;th&gt;Source&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${entries.filter(e=&gt;e.item===&#x27;cedar&#x27;).sort((a,b)=&gt;a.at-b.at).map(e=&gt;`&lt;tr&gt;&lt;td&gt;${tag(e.kind===&#x27;incoming&#x27;?&#x27;Expected receipt&#x2 function presetPage(){const p=presets[state.presetVariant];return `&lt;div class=&quot;title&quot;&gt;&lt;div&gt;&lt;h2&gt;Presets&lt;/h2&gt;&lt;p&gt;Option → materials + tasks + timing + cost. Used when work is created.&lt;/p&gt;&lt;/div&gt;&lt;label&gt;Model / frame&lt;select id=&quot;tb2-preset-variant&quot;&gt;${Object.keys(presets).map(k=&gt;`&lt;option value=&quot;${k}&quot; ${k===state.presetVariant?&#x27;selected&#x27;:&#x27;&#x27;}&gt;${k.replace(&#x27;|&#x27;,&#x27; · &#x27;)}&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;table-wrap&quot;&gt;&lt;table class=&quot;preset-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Option / coverage&lt;/th&gt;&lt;th&gt;Materials&lt;/th&gt;&lt;th&gt;Tasks created&lt;/th&gt;&lt;th&gt;Timing&lt;/th&gt;&lt;th&gt;Labour&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;Cost&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;Price&lt;/th&gt;&lt;th&gt;Edit&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Base · ${p.model} / ${p.frame}&lt;/td&gt;&lt;td&gt;Frame + panel kit × 1&lt;/td&gt;&lt;td&gt;Prepare, deliver, assemble&lt;/td&gt;&lt;td&gt;From delivery date&lt;/td&gt;&lt;td&gt;40 h&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;Demo&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${money(p.base)}&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;${[.5,1].map(f=&gt;`&lt;tr&gt;&lt;td&gt;Cedar · ${f===.5?&#x27;half&#x27;:&#x27;full&#x27;} sides&lt;/td&gt;&lt;td&gt;${p.panels*f} cedar panels&lt;/td&gt;&lt;td&gt;Pick siding → install → inspect&lt;/td&gt;&lt;td&gt;Pick ${p.leadDays}d before build&lt;br&gt;Install ${p.days}d&lt;/td&gt;&lt;td&gt;${(p.panels*f*p.hoursPerPanel).toFixed(1)} h&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${money(p.panels*f*p.cedarCost)}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${money(p.panels*f*p.cedarPrice)}&lt;/td&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;link cursor-interaction&quot; data-action=&quot;edit-preset&quot;&gt;Edit&lt;/button&gt;&lt;/td& function renderSchema(){const data=[[&#x27;work&#x27;,&#x27;Work&#x27;,&#x27;Customer quotes/orders and factory batches&#x27;,&#x27;ID, type, customer/factory, status, site, requested/promised dates&#x27;,&#x27;Groups selections, tasks and stock entries&#x27;],[&#x27;selections&#x27;,&#x27;Selections&#x27;,&#x27;Options chosen for each order; batch outputs&#x27;,&#x27;Work ID, option, model/frame preset, coverage, override, saved price&#x27;,&#x27;Uses Presets; produces material demand or supply&#x27;],[&#x27;presets&#x27;,&#x27;Presets&#x27;,&#x27;What each option needs and creates&#x27;,&#x27;Model/frame, option, coverage, item quantities, task templates, offsets, hours, cost, price&#x27;,&#x27;Feeds selections and task generation&#x27;],[&#x27;tasks&#x27;,&#x27;Tasks&#x27;,&#x27;Every action, stage and subtask&#x27;,&#x27;Work ID, parent task, action, owner, start/end, dependency, status, completion note&#x27;,&#x27;Today / Timeline / Project are views of this table&#x27;],[&#x27;items&#x27;,&#x27;Items&#x27;,&#x27;Exact inventory variants&#x27;,&#x27;SKU, name, colour/size, unit, location&#x27;,&#x27;Referenced by preset recipes and stock entries&#x27;],[&#x27;stock&#x27;,&#x27;Stock entries&#x27;,&#x27;Expected, committed and actual quantities&#x27;,&#x27;Item, work, task, type, quantity, date, source/replaces ID&#x27;,&#x27;Calculates current stock and future availability&#x27;]];root.querySelector(&#x27;#tb2-tables&#x27;).innerHTML=`&lt;div class=&quot;title&quot;&gt;&lt;div&gt;&lt;h2&gt;Six core tables&lt;/h2&gt;&lt;p&gt;Work is an order or a production batch. A project is its detailed task view.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;schema-flow&quot;&gt;&lt;span&gt;Presets → selections + tasks&lt;/span&gt;&lt;span&gt;Confirmed orders → reserved stock&lt;/span&gt;&lt;span&gt;Production → expected supply → received stock&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;table-wrap&quot;&gt;&lt;table class=&quot;schema-table&quot;&gt;&lt;thead&gt;&lt; function schemaSample(){let heads,rows;if(state.table===&#x27;tasks&#x27;){heads=[&#x27;Task ID&#x27;,&#x27;Work ID&#x27;,&#x27;Parent task&#x27;,&#x27;Action&#x27;,&#x27;Start&#x27;,&#x27;End&#x27;];rows=tasks.slice(8,15).map(t=&gt;[t.id,t.job,t.parent||&#x27;—&#x27;,t.title,date(t.start),date(t.end)]);}else if(state.table===&#x27;work&#x27;){heads=[&#x27;Work ID&#x27;,&#x27;Type&#x27;,&#x27;Name&#x27;,&#x27;Status&#x27;,&#x27;Target date&#x27;];rows=jobs.map(j=&gt;[j.id,j.type,j.name,j.status,date(j.promise)]);}else if(state.table===&#x27;selections&#x27;){const q=qcalc();heads=[&#x27;Work ID&#x27;,&#x27;Option&#x27;,&#x27;Choice&#x27;,&#x27;Coverage&#x27;,&#x27;Generated requirement&#x27;];rows=[[&#x27;Q-104&#x27;,&#x27;Model&#x27;,quote.model,&#x27;—&#x27;,&#x27;Frame/panel kit × 1&#x27;],[&#x27;Q-104&#x27;,&#x27;Frame&#x27;,quote.frame,&#x27;—&#x27;,quote.model+&#x27; / &#x27;+quote.frame],[&#x27;Q-104&#x27;,&#x27;Siding&#x27;,quote.siding,quote.coverage+&#x27; sides&#x27;,q.qty+&#x27; panels&#x27;],[&#x27;F-12&#x27;,&#x27;Batch output&#x27;,&#x27;Cedar panels&#x27;,&#x27;120 units&#x27;,&#x27;+120 expected stock&#x27;]];}else if(state.table===&#x27;presets&#x27;){heads=[&#x27;Model / frame&#x27;,&#x27;Siding coverage&#x27;,&#x27;Materials&#x27;,&#x27;Labour&#x27;,&#x27;Tasks&#x27;];rows=Object.values(presets).map(p=&gt;[p.model+&#x27; / &#x27;+p.frame,&#x27;Half sides&#x27;,p.panels/2+&#x27; cedar panels&#x27;,(p.panels/2*p.hoursPerPanel).toFixed(1)+&#x27; h&#x27;,&#x27;Pick → install → inspect&#x27;]);}else if(state.table===&#x27;items&#x27;){heads=[&#x27;SKU&#x27;,&#x27;Item&#x27;,&#x27;Unit&#x27;,&#x27;Location&#x27;];rows=items.map(i=&gt;[i.id,i.name,i.unit,&#x27;Toronto warehouse&#x27;]);}else{heads=[&#x27;Entry&#x27;,&#x27;Item&#x27;,&#x27;Work&#x27;,&#x27;Type&#x27;,&#x27;Qty&#x27;,&#x27;Date&#x27;];rows=entries.filter(e=&gt;e.item===&#x27;cedar&#x27;).map(e=&gt;[e.id,e.item,e.job,e.kind,e.qty,date(e.at)]);}return `&lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;${heads.map(h=&gt;`&lt;th&gt;${h}&lt;/th&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${rows.map(r=&gt;`&lt;tr&gt;${r.map(v=&gt;`&lt;td&gt;${esc(v)}&lt;/td&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;`).join(&#x27;&#x27;)}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;`;}
function legacyOpenDialog(kind,id,extra={}){lastFocus=document.activeElement;state.dialog={kind,id,...extra};let title=&#x27;&#x27;,sub=&#x27;&#x27;,body=&#x27;&#x27;,confirm=&#x27;Save&#x27;;const t=taskBy(id),j=t?jobBy(t.job):null;
if(kind===&#x27;complete&#x27;){title=t.done?&#x27;Reopen task?&#x27;:t.receipt?&#x27;Receive usable stock&#x27;:&#x27;Complete task?&#x27;;sub=t.job+&#x27; · &#x27;+t.title;confirm=t.done?&#x27;Reopen&#x27;:t.receipt?&#x27;Record receipt&#x27;:&#x27;Confirm complete&#x27;;const incoming=entries.find(e=&gt;e.task===t.id&amp;&amp;e.kind===&#x27;incoming&#x27;);body=`${t.receipt&amp;&amp;!t.done?`&lt;div class=&quot;fields&quot;&gt;&lt;label&gt;Usable quantity received&lt;input id=&quot;tb2-receive-qty&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;${incoming?.qty||0}&quot; value=&quot;${incoming?.qty||0}&quot;&gt;&lt;/label&gt;&lt;label&gt;Receipt date&lt;input id=&quot;tb2-receive-date&quot; type=&quot;date&quot; value=&quot;${iso(today)}&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;p class=&quot;small muted space&quot;&gt;Outstanding: ${incoming?.qty||0} cedar panels. Partial receipt leaves the remainder expected.&lt;/p&gt;`:&#x27;&#x27;}&lt;label class=&quot;space&quot;&gt;Comment (optional)&lt;textarea id=&quot;tb2-comment&quot; placeholder=&quot;Add a note about what was completed…&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;p class=&quot;small muted space&quot;&gt;Completed by Demo user · recorded in task history.&lt;/p&gt;`;}
if(kind===&#x27;edit&#x27;){title=t.title;sub=t.job+&#x27; · &#x27;+(t.parent?taskBy(t.parent)?.title:&#x27;Top-level stage&#x27;);const ds=dates(t);confirm=t.group?&#x27;Close&#x27;:&#x27;Save task&#x27;;body=`&lt;div class=&quot;fields&quot;&gt;&lt;label&gt;Start&lt;input id=&quot;tb2-edit-start&quot; type=&quot;date&quot; value=&quot;${iso(extra.start??ds[0])}&quot; ${t.group?&#x27;readonly&#x27;:&#x27;&#x27;}&gt;&lt;/label&gt;&lt;label&gt;End / deadline&lt;input id=&quot;tb2-edit-end&quot; type=&quot;date&quot; value=&quot;${iso(extra.end??ds[1])}&quot; ${t.group?&#x27;readonly&#x27;:&#x27;&#x27;}&gt;&lt;/label&gt;&lt;label&gt;Owner&lt;input id=&quot;tb2-edit-owner&quot; value=&quot;${esc(t.owner)}&quot; ${t.group?&#x27;readonly&#x27;:&#x27;&#x27;}&gt;&lt;/label&gt;&lt;label&gt;Status&lt;select id=&quot;tb2-edit-status&quot; ${t.group||t.done?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;&lt;option&gt;${t.done?&#x27;Complete&#x27;:t.status||&#x27;Not started&#x27;}&lt;/option&gt;&lt;option&gt;In progress&lt;/option&gt;&lt;option&gt;Blocked&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;full&quot;&gt;Completion / progress note&lt;textarea id=&quot;tb2-comment&quot;&gt;${esc(t.comment||&#x27;&#x27;)}&lt;/textarea&gt;&lt;/label&gt;&lt;/div&gt;${t.group?&#x27;&lt;p class=&quot;small muted space&quot;&gt;Stage dates roll up from its child tasks.&lt;/p&gt;&#x27;:t.depends?`&lt;p class=&quot;small muted space&quot;&gt;Depends on: ${esc(taskBy(t.depends)?.title||t.depends)}.&lt;/p&gt;`:&#x27;&#x27;}${t.receipt?&#x27;&lt;div class=&quot;notice space&quot;&gt;Changing this end date also moves the expected stock-availability date. Customer promises remain unchanged.&lt;/div&gt;&#x27;:&#x27;&#x27;}&lt;div id=&quot;tb2-edit-impact&quot; class=&quot;space small&quot; aria-live=&quot;polite&quot;&gt;${extra.start!==undefined?&#x27;Moved on timeline. Review dates before saving. &#x27;:&#x27;&#x27;}${t.receipt&amp;&amp;entries.some(e=&gt;e.item===&#x27;cedar&#x27;&amp;&amp;e.kind===&#x27;reserved&#x27;&amp;&amp;e.at&lt;(extra.end??ds[1]))?&#x27;This receipt would arrive after a customer material need date. Customer promises remain unchanged.&#x27;:&#x27;&#x27;}&lt;/div&gt;`;}
if(kind===&#x27;quote-confirm&#x27;){const q=qcalc(),short=q.available&lt;q.qty||q.steelAvailable&lt;q.steel;title=short?&#x27;Resolve material shortfall&#x27;:&#x27;Confirm this order?&#x27;;sub=&#x27;Q-104 · &#x27;+quote.customer;confirm=short?&#x27;Return to quote&#x27;:&#x27;Confirm order&#x27;;body=`&lt;div class=&quot;keyvalues space&quot;&gt;&lt;span&gt;Requested delivery&lt;/span&gt;&lt;span&gt;${date(quote.date)}&lt;/span&gt;&lt;span&gt;Materials needed&lt;/span&gt;&lt;span&gt;${date(q.need)}&lt;/span&gt;&lt;span&gt;Price before tax / shipping&lt;/span&gt;&lt;span&gt;${money(q.price)}&lt;/span&gt;&lt;/div&gt;&lt;hr&gt;&lt;p class=&quot;small&quot;&gt;${short?&#x27;The chosen materials cannot cover this date. Adjust the date or configuration.&#x27;:`Reserve ${q.qty} ${quote.siding} panels${q.steel?&#x27; + &#x27;+q.steel+&#x27; steel panels&#x27;:&#x27;&#x27;}, save this preset version and generate preparation/build tasks. Trade and transport bookings remain tasks to complete.`}&lt;/p&gt;`;state.dialog.short=short;}

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
